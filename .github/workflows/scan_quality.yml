name: Scan quality monitor

# Records scan health indicators daily (ML-gate strictness, VIX source/mismatch, saturated columns, staleness) and sends a Telegram message
# ONLY when the set of RED flags changes. Read-only for trading. See scripts/scan_quality_report.py and docs/plan_oct2026_costs_and_scan.md.
permissions:
  contents: write

on:
  schedule:
    - cron: '40 23 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: scan-quality
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      TRADE_TELEGRAM_TOKEN: ${{ secrets.TRADE_TELEGRAM_TOKEN }}
      TRADE_TELEGRAM_CHAT_ID: ${{ secrets.TRADE_TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas pyarrow
      - name: Report
        run: python scripts/scan_quality_report.py
      - name: Commit history
        run: |
          git config user.name "stockscout-quality-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/scan_quality/history.jsonl
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "scan quality: $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break || sleep 5; done
