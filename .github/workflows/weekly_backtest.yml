name: Weekly Backtest

permissions:
  contents: write
  issues: write

on:
  schedule:
    # Run every Sunday at 6:00 AM UTC
    - cron: '0 6 * * 0'

  workflow_dispatch:
    inputs:
      start_date:
        description: 'Backtest start date (YYYY-MM-DD, blank = 12 months ago)'
        required: false
        type: string
        default: ''
      end_date:
        description: 'Backtest end date (YYYY-MM-DD, blank = today UTC)'
        required: false
        type: string
        default: ''
      ablation:
        description: 'Run ablation study'
        required: false
        type: boolean
        default: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backtest
        id: backtest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # Rolling window: default to (today - 12 months) → today when the
          # dispatch inputs are blank (or on cron). Keeps the metric relevant
          # to CURRENT market conditions instead of drifting further from a
          # fixed 2025-06 → 2026-03 window every week.
          START="${{ inputs.start_date }}"
          END="${{ inputs.end_date }}"
          if [ -z "$START" ]; then
            START=$(date -u -d '12 months ago' +%Y-%m-%d)
          fi
          if [ -z "$END" ]; then
            END=$(date -u +%Y-%m-%d)
          fi
          echo "Backtest window: $START → $END"
          ABLATION_FLAG=""
          if [ "${{ inputs.ablation }}" = "true" ]; then
            ABLATION_FLAG="--ablation"
          fi
          python scripts/run_full_backtest.py \
            --start "$START" --end "$END" \
            --universe-size 200 \
            --output reports/backtest_latest.json \
            $ABLATION_FLAG

      - name: Send Telegram summary + regression alerts
        # Runs BEFORE the commit so the history compare sees the prior week's
        # row (still on disk from last run's commit), not this one.
        env:
          PYTHONPATH: ${{ github.workspace }}
          TRADE_TELEGRAM_TOKEN: ${{ secrets.TRADE_TELEGRAM_TOKEN }}
          TRADE_TELEGRAM_CHAT_ID: ${{ secrets.TRADE_TELEGRAM_CHAT_ID }}
        run: |
          # Exit code 2 = regression detected + alert sent (still success for the
          # workflow — the whole point of this step is to SURFACE that state).
          python scripts/backtest_summary.py || rc=$?
          if [ "${rc:-0}" = "2" ]; then
            echo "::warning::Weekly backtest regression detected — see Telegram alert."
          elif [ "${rc:-0}" != "0" ]; then
            echo "::error::backtest_summary.py failed with rc=$rc"
            exit $rc
          fi

      - name: Commit backtest results + history
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly backtest results $(date +%Y-%m-%d) [skip ci]"
            git push
          fi
