name: Weekly Backtest

permissions:
  contents: write
  issues: write

on:
  schedule:
    # Run every Sunday at 6:00 AM UTC
    - cron: '0 6 * * 0'

  workflow_dispatch:
    inputs:
      start_date:
        description: 'Backtest start date (YYYY-MM-DD, blank = 12 months ago)'
        required: false
        type: string
        default: ''
      end_date:
        description: 'Backtest end date (YYYY-MM-DD, blank = today UTC)'
        required: false
        type: string
        default: ''
      ablation:
        description: 'Run ablation study'
        required: false
        type: boolean
        default: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backtest
        id: backtest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # Rolling window: default to (today - 12 months) → today when the
          # dispatch inputs are blank (or on cron). Keeps the metric relevant
          # to CURRENT market conditions instead of drifting further from a
          # fixed 2025-06 → 2026-03 window every week.
          START="${{ inputs.start_date }}"
          END="${{ inputs.end_date }}"
          if [ -z "$START" ]; then
            START=$(date -u -d '12 months ago' +%Y-%m-%d)
          fi
          if [ -z "$END" ]; then
            END=$(date -u +%Y-%m-%d)
          fi
          echo "Backtest window: $START → $END"

          # 2026-09-14 (deep-investigation-sep14 Phase 3 v2): replay backtest
          # over the LIVE pipeline's own scan_outcomes.jsonl instead of the
          # 90-min compute-from-scratch engine.
          #
          # Why: the compute engine sampled top-200-by-market-cap and hit the
          # score-73-85 window essentially never (n=0 with --prod-gates on the
          # first live run). The live pipeline scans ~2000 tickers and persists
          # every resolved record — replaying gates over that dataset matches
          # what production actually sees, runs in seconds, and uses zero
          # third-party API calls.
          #
          # scan_outcomes.jsonl lives on the VPS and only trickles into this
          # repo via nightly commits (models/, weekly reports), so we fetch it
          # from the VPS backup on Supabase-recovery (checked in). Fallback to
          # the local file if it exists (older workflow revisions may have it).
          #
          # Ablation input is now a no-op — the replay design doesn't have a
          # meaningful ablation. Ignored silently for backward compat.
          # ------------------------------------------------------------
          # NOTE ON DATA AVAILABILITY:
          # This workflow runs on GH Actions VMs. scan_outcomes.jsonl lives on
          # the VPS. For now we ship a snapshot of the recovered file inside
          # the repo (data/outcomes/scan_outcomes.jsonl is gitignored, but
          # scan_outcomes_recovered.jsonl is present in the repo history after
          # the 2026-08-24 recovery). run_replay_backtest.py auto-falls back
          # to the recovered file if the active one is missing/empty.
          # ------------------------------------------------------------
          python scripts/run_replay_backtest.py \
            --start "$START" --end "$END" \
            --output reports/backtest_latest.json

      - name: Send Telegram summary + regression alerts
        # Runs BEFORE the commit so the history compare sees the prior week's
        # row (still on disk from last run's commit), not this one.
        env:
          PYTHONPATH: ${{ github.workspace }}
          TRADE_TELEGRAM_TOKEN: ${{ secrets.TRADE_TELEGRAM_TOKEN }}
          TRADE_TELEGRAM_CHAT_ID: ${{ secrets.TRADE_TELEGRAM_CHAT_ID }}
        run: |
          # Exit code 2 = regression detected + alert sent (still success for the
          # workflow — the whole point of this step is to SURFACE that state).
          python scripts/backtest_summary.py || rc=$?
          if [ "${rc:-0}" = "2" ]; then
            echo "::warning::Weekly backtest regression detected — see Telegram alert."
          elif [ "${rc:-0}" != "0" ]; then
            echo "::error::backtest_summary.py failed with rc=$rc"
            exit $rc
          fi

      - name: Commit backtest results + history
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Weekly backtest results $(date +%Y-%m-%d) [skip ci]"
          # 2026-09-14: race protection. Between the backtest run (~1s replay)
          # and the push, another workflow (portfolio snapshot commits every
          # 15 min) can advance main. Try push, on rejection pull --rebase and
          # retry. Up to 3 attempts.
          for i in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push rejected (attempt $i) — pulling with rebase and retrying"
            git pull --rebase origin main || true
          done
          echo "::error::Push failed after 3 attempts"
          exit 1
