name: CI Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: Pytest sanity
        run: python -c "import pytest, sys; print('pytest ok')"

      - name: Pytest discovery
        run: |
          pytest -q --collect-only tests > .pytest_collect.txt || true
          echo 'Collected:'
          head -50 .pytest_collect.txt
          grep -E "collected [1-9][0-9]* items" .pytest_collect.txt || (echo "No tests collected" && exit 1)

      - name: Run fast unit tests (no API calls)
        run: |
          pytest -q -x --timeout=30 \
            tests/test_pure_functions.py \
            tests/test_allocate.py \
            tests/test_edge_cases.py \
            tests/test_feature_registry.py \
            tests/test_contracts.py \
            tests/test_ml_contract_latest.py

      - name: Verify core imports
        run: |
          python -c "
          from core.config import get_config
          from core.data import fetch_price_multi_source
          from core.scoring import compute_technical_score
          from core.price_verify import fetch_prices_for_ticker
          from app_config import CONFIG
          print('All core imports verified')
          "

  trading-money-path:
    # 2026-09-29: none of the trading tests ran in CI (ci.yml covered ~5% of the suite). These are the
    # money-path regression tests — buy fills / locks / fail-closed dedup / breakers / exit prices /
    # config consistency. No network, no keys. ib_insync is installed here (it is deliberately NOT in
    # requirements.txt for Streamlit Cloud) so the fill tests are not silently skipped.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout ib_insync
      - name: Money-path tests (skips are failures)
        run: |
          pytest -q --timeout=60 -o addopts="" -rs \
            tests/test_buy_bracket_fills.py \
            tests/test_trade_lock_and_dedup.py \
            tests/test_failclosed_dedup.py \
            tests/test_breakers_use_ledger.py \
            tests/test_exit_prices_realtime.py \
            tests/test_target_hit_failed_sell.py \
            tests/test_config_consistency.py \
            tests/test_phase2_gates.py \
            | tee /tmp/money.txt
          if grep -qE "[0-9]+ skipped" /tmp/money.txt; then echo "A money-path test was SKIPPED — that hides regressions"; exit 1; fi

  shellcheck:
    # Informational until the baseline is known (not blocking): the deploy scripts have had silent-failure
    # bugs (`|| true` clobbering $?, atomic git checkout hidden by 2>/dev/null).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck deploy scripts
        run: shellcheck -S warning deploy/*.sh
