name: Weekly Sunday reminder

# Telegram heads-up every Sunday evening (owner's bot, no trading, no VPS):
#  1) IBKR may ask for a fresh 2FA approval around the weekly re-authentication (seen Mon 2026-10-05 ~05:45 UTC, "2FA STUCK").
#  2) The forward test F2 (LLM picker) needs a new round every Sunday before Monday's open (docs/research_prereg_F2_llm_picker.md).
permissions:
  contents: read

on:
  schedule:
    - cron: '0 17 * * 0'     # Sunday 17:00 UTC = 20:00 Israel
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TELEGRAM_TOKEN: ${{ secrets.TRADE_TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TRADE_TELEGRAM_CHAT_ID }}
    steps:
      - name: Send reminder
        run: |
          set -euo pipefail
          MSG=$(printf '%s\n' \
            "🗓️ <b>תזכורת שבועית (יום ראשון)</b>" \
            "" \
            "1️⃣ <b>IBKR:</b> סביב חידוש האימות השבועי יתכן שיבקשו אישור 2FA. אם תקבל 'CIRCUIT BREAKER — 2FA STUCK' — אשר את ה-push באפליקציית IBKR או שלח /login לבוט." \
            "2️⃣ <b>מבחן F2:</b> סבב חדש של בוחר ה-AI צריך להתבצע לפני פתיחת השוק מחר. כתוב ל-Claude: 'תריץ סבב F2'." )
          curl -sS --fail -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MSG}" > /dev/null
          echo "reminder sent"
